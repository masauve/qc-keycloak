apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgresql
  namespace: keycloak
  labels:
    app: keycloak-postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
  selector:
    app: keycloak-postgresql
  clusterIP: None
