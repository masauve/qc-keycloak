apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak

# Aucune definition de Task locale : la pipeline reference uniquement les taches
# fournies par Red Hat (git-clone, maven, buildah, openshift-client) via le
# resolveur « cluster » dans l'espace de noms openshift-pipelines.
resources:
  - serviceaccount.yaml
  - imagestream.yaml
  - pipeline.yaml
  - triggers/triggerbinding.yaml
  - triggers/triggertemplate.yaml
  - triggers/eventlistener.yaml
