apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak

resources:
  - ../../base

# Remplacer le domaine OpenShift pour la production
patches:
  - target:
      group: k8s.keycloak.org
      version: v2alpha1
      kind: Keycloak
      name: keycloak
    patch: |-
      - op: replace
        path: /spec/hostname/hostname
        value: keycloak.apps.VOTRE_CLUSTER.example.com
      - op: replace
        path: /spec/instances
        value: 3

commonLabels:
  environment: production
