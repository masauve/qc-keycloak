apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: quebec
spec:
  params:
    - name: url
      type: string
      description: URL du dépôt Git à cloner
    - name: revision
      type: string
      description: Branche, tag ou SHA à extraire
      default: main
    - name: depth
      type: string
      description: Profondeur du clone (0 = complet)
      default: "1"
    - name: sslVerify
      type: string
      description: Vérifier le certificat TLS du serveur Git
      default: "true"
  workspaces:
    - name: output
      description: Répertoire de destination du clone
  results:
    - name: commit
      description: SHA du commit extrait
    - name: url
      description: URL du dépôt cloné
  steps:
    - name: clone
      image: registry.redhat.io/ubi9/ubi:latest
      env:
        - name: PARAM_URL
          value: $(params.url)
        - name: PARAM_REVISION
          value: $(params.revision)
        - name: PARAM_DEPTH
          value: $(params.depth)
        - name: PARAM_SSL_VERIFY
          value: $(params.sslVerify)
        - name: WORKSPACE_OUTPUT_PATH
          value: $(workspaces.output.path)
      script: |
        #!/usr/bin/env bash
        set -eu

        git config --global credential.helper ""
        git config --global safe.directory '*'
        git config --global http.sslVerify "${PARAM_SSL_VERIFY}"

        if [ -d "${WORKSPACE_OUTPUT_PATH}/.git" ]; then
          echo "Nettoyage du répertoire existant..."
          rm -rf "${WORKSPACE_OUTPUT_PATH:?}"/*
          rm -rf "${WORKSPACE_OUTPUT_PATH}"/.[!.]*
        fi

        echo "Clonage de ${PARAM_URL} (revision: ${PARAM_REVISION}, profondeur: ${PARAM_DEPTH})"

        git clone \
          --depth="${PARAM_DEPTH}" \
          "${PARAM_URL}" \
          "${WORKSPACE_OUTPUT_PATH}"

        cd "${WORKSPACE_OUTPUT_PATH}"

        git fetch --depth="${PARAM_DEPTH}" origin "${PARAM_REVISION}" 2>/dev/null || true
        git checkout "${PARAM_REVISION}" 2>/dev/null || \
          git checkout -b "detached-${PARAM_REVISION}" "origin/${PARAM_REVISION}" 2>/dev/null || true

        COMMIT_SHA="$(git rev-parse HEAD)"
        printf "%s" "${COMMIT_SHA}" > "$(results.commit.path)"
        printf "%s" "${PARAM_URL}"  > "$(results.url.path)"
        echo "Commit extrait : ${COMMIT_SHA}"
