apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
    app.kubernetes.io/part-of: quebec
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  instances: 2
  # Image construite par le pipeline Tekton et poussée dans le registre interne OpenShift
  image: image-registry.openshift-image-registry.svc:5000/keycloak/keycloak-custom:latest
  # startOptimized: true indique à l'opérateur que l'image a déjà été optimisée (kc.sh build exécuté dans le Containerfile)
  startOptimized: true
  db:
    vendor: postgres
    host: keycloak-postgresql
    port: 5432
    database: keycloak
    poolInitialSize: 5
    poolMinSize: 5
    poolMaxSize: 20
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  http:
    httpEnabled: false
    httpsPort: 8443
    tlsSecret: keycloak-tls-secret
  hostname:
    # Gabarit generique — remplace par overlay (doit correspondre au dnsName
    # du Certificate). Voir overlays/production/kustomization.yaml.
    hostname: keycloak.apps.example.com
    strict: true
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2"
  additionalOptions:
    - name: log-level
      value: INFO
    # user-event-metrics : requis pour que event-metrics-user-enabled (image)
    # produise keycloak_user_events_total (tableau « capacity planning »).
    # « features » est une option de BUILD : cette valeur doit correspondre a
    # celle integree a l'image (container/Containerfile), sinon « build time
    # options ... differ from what is persisted » et Keycloak ne demarre pas.
    - name: features
      value: "token-exchange,admin-fine-grained-authz,user-event-metrics"
    - name: cache
      value: ispn
    # jdbc-ping : decouverte du cluster via la base PostgreSQL existante.
    # Recommande/par defaut pour l'operateur depuis Keycloak 26.1 ; remplace
    # le stack « kubernetes » (DNS_PING) qui exigeait -Djgroups.dns.query et
    # echouait avec « dns_query can not be null or empty ».
    - name: cache-stack
      value: jdbc-ping
    - name: http-relative-path
      value: /auth
    # --- Observabilite ---
    # metrics-enabled / health-enabled / event-metrics-user-enabled sont des
    # options de BUILD : integrees a l'image (voir container/Containerfile).
    # Avec startOptimized: true, les placer ici declenche « build time options
    # have values that differ from what is persisted ... will NOT be used » et
    # empeche le demarrage -- ne PAS ajouter « metrics-enabled » ici.
    # Les metriques sont exposees sur l'interface de gestion (port 9000) ;
    # http-relative-path=/auth s'y applique aussi, d'ou le chemin /auth/metrics.
    #
    # http-metrics-histograms-enabled est en revanche une option d'EXECUTION :
    # elle prend effet malgre startOptimized: true. Active les seaux de
    # percentiles necessaires aux cartes de latence du tableau de bord
    # « troubleshooting ».
    - name: http-metrics-histograms-enabled
      value: "true"
  # L'operateur RHBK 26.4 cree automatiquement un ServiceMonitor lorsque
  # « metrics-enabled » figure dans le CR. On le DESACTIVE car ce depot fournit
  # son propre ServiceMonitor declaratif (gitops/base/monitoring/) au chemin
  # /auth/metrics ; sans cela, les deux scrapent le meme endpoint -> series
  # dupliquees et double comptage (sum by(pod) ...).
  serviceMonitor:
    enabled: false
