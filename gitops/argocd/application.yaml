apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhbk-keycloak
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: rhbk-keycloak
    app.kubernetes.io/part-of: quebec
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/masauve/qc-keycloak.git
    targetRevision: main
    path: gitops/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: operators.coreos.com
      kind: Subscription
      jsonPointers:
        - /status
    - group: k8s.keycloak.org
      kind: Keycloak
      jsonPointers:
        - /status
    # volumeClaimTemplates est immuable apres creation et Kubernetes y ajoute
    # des defauts (volumeMode: Filesystem) : drift cosmetique permanent.
    - group: apps
      kind: StatefulSet
      name: keycloak-postgresql
      jsonPointers:
        - /spec/volumeClaimTemplates
    # Le controleur Tekton Triggers ajoute spec.namespaceSelector: {} par defaut
    # (absent du manifeste git) : drift cosmetique permanent.
    - group: triggers.tekton.dev
      kind: EventListener
      name: keycloak-github-webhook
      jsonPointers:
        - /spec/namespaceSelector
