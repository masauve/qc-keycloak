apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhbk-keycloak
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: rhbk-keycloak
    app.kubernetes.io/part-of: quebec
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/masauve/qc-keycloak.git
    targetRevision: main
    path: gitops/base
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: operators.coreos.com
      kind: Subscription
      jsonPointers:
        - /status
    - group: k8s.keycloak.org
      kind: Keycloak
      jsonPointers:
        - /status
