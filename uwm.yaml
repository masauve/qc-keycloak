# Amorçage UserWorkloadMonitoring (OpenShift 4.21) — voir README §9.1.
# Active le monitoring des projets utilisateur (Prometheus dans
# openshift-user-workload-monitoring), prérequis du ServiceMonitor Keycloak.
#
# Opération hors bande (modifie openshift-monitoring, hors du périmètre Argo CD) :
#   oc apply -f uwm.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-monitoring-config
  namespace: openshift-monitoring
data:
  config.yaml: |
    enableUserWorkload: true
