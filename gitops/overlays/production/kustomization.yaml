apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak

resources:
  - ../../base
  # Le monitoring est reference ici (overlay) plutot que dans base/ a dessein :
  # base/kustomization.yaml utilise « commonLabels », qui injecte ses etiquettes
  # dans les SELECTEURS. Le Service keycloak-metrics cible des pods geres par
  # l'operateur (etiquette app=keycloak), qui ne portent pas managed-by=argocd ;
  # passer par l'overlay (« labels » avec includeSelectors: false) preserve donc
  # son selecteur. Voir gitops/base/monitoring/.
  - ../../base/monitoring

# Remplacer le domaine OpenShift pour la production
patches:
  - target:
      group: k8s.keycloak.org
      version: v2alpha1
      kind: Keycloak
      name: keycloak
    patch: |-
      - op: replace
        path: /spec/hostname/hostname
        value: keycloak.apps.sno.myocp.net
      - op: replace
        path: /spec/instances
        value: 1
  # Aligner le nom DNS du certificat sur le hostname Keycloak de production
  - target:
      group: cert-manager.io
      version: v1
      kind: Certificate
      name: keycloak-tls
    patch: |-
      - op: replace
        path: /spec/dnsNames/0
        value: keycloak.apps.sno.myocp.net

# « labels » avec includeSelectors: false : ajoute l'etiquette d'environnement
# aux metadonnees SANS l'injecter dans les selecteurs. commonLabels l'aurait
# ajoutee au selecteur immuable du StatefulSet PostgreSQL :
#   StatefulSet "keycloak-postgresql" is invalid: spec: Forbidden: updates to
#   statefulset spec for fields other than ... are forbidden
labels:
  - pairs:
      environment: production
    includeSelectors: false
