# Patch de argocd-cm pour le health check personnalisé des PersistentVolumeClaim
#
# Les PVC avec volumeBindingMode=WaitForFirstConsumer restent en état Pending
# jusqu'au premier montage par un pod Tekton. Sans ce patch, ArgoCD les
# considère comme non-sains (Progressing) et bloque les sync-waves indéfiniment.
#
# Appliquer une seule fois en tant qu'administrateur du cluster :
#   oc patch configmap argocd-cm -n openshift-gitops \
#     --type=merge \
#     --patch-file gitops/argocd/openshift-gitops-patch.yaml
#
# Le --type=merge ajoute uniquement la clé manquante sans écraser
# les autres entrées gérées par l'opérateur OpenShift GitOps.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: openshift-gitops
data:
  resource.customizations.health.PersistentVolumeClaim: |
    hs = {}
    if obj.status ~= nil then
      if obj.status.phase == "Bound" or obj.status.phase == "Pending" then
        hs.status = "Healthy"
        hs.message = obj.status.phase
        return hs
      end
    end
    hs.status = "Progressing"
    hs.message = "En attente de liaison du PVC"
    return hs
